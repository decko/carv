[package]
name = "carv"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Minimal Rust Coding Agent with Tree-sitter + LSP"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "process", "time", "fs", "sync"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-eventsource = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"

# Tree-sitter — version compatibility resolved in issue #4.
# Core vs. grammar version mismatch is expected: grammars compile their own
# C code and expose `extern "C" fn tree_sitter_<name>() -> Language`. The
# core crate loads these at runtime. Tested with these version pairs:
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"

[dev-dependencies]
# Pre-commit hooks (user-hooks feature is mutually exclusive with other features,
# so the .cargo-husky/hooks/pre-commit script handles all checks).
cargo-husky = { version = "1", default-features = false, features = ["precommit-hook", "user-hooks"] }

[build-dependencies]
# cc = "1"  # Deferred with tree-sitter; only needed for C grammar compilation.
